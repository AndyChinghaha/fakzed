[project]
name = "fakzed-server"
version = "0.2.0"
description = "Fakzed platform server: agent registry, REST/SSE API, auth, multi-tenancy, run management."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "fakzed contributors" }]
keywords = ["agent", "ai", "llm", "platform", "server", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fakzed",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
fakzed-server = "fakzed_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakzed_server"]
