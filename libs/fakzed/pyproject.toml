[project]
name = "fakzed"
version = "0.1.0"
description = "Fakzed: a lightweight Python framework for building agent platforms. Three primitives (Agent, Team, Workflow) with pluggable capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "fakzed contributors" }]
keywords = ["agent", "ai", "llm", "multi-agent", "workflow", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.7",
    "rich>=15.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.34"]
ollama = ["ollama>=0.3"]
deepseek = ["openai>=1.50"]
sqlite = ["sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakzed"]
