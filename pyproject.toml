[project]
name = "fakzed-workspace"
version = "0.0.0"
description = "Fakzed monorepo workspace: SDK, platform server, and web UI"
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["libs/fakzed", "libs/fakzed-server"]

[tool.uv.sources]
fakzed = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
    "fakzed[openai,anthropic,ollama,deepseek,sqlite]",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fakzed", "fakzed_server"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's idiomatic `Depends(...)` in argument defaults trips B008.
"libs/fakzed-server/src/fakzed_server/app.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["libs"]
addopts = "-q"
