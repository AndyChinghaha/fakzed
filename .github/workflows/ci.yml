name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint / types / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy libs/fakzed/src/fakzed libs/fakzed-server/src/fakzed_server

      - name: Tests
        run: uv run pytest

  ui:
    name: web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
