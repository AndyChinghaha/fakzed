name: Feature Request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！描述得越具体，越容易被实现。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在遇到了什么不便或限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 fakzed 提供什么能力？API 长什么样？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 使用场景、相关链接、截图等
